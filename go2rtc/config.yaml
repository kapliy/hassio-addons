# Forked from https://github.com/AlexxIT/hassio-addons/tree/master/go2rtc
# Uses ghcr.io/kapliy/go2rtc with the Tapo H265 patch for C460 et al.
name: go2rtc (Tapo H265 patched)
description: Tapo C460 / 4K battery cam H265 fix layered on AlexxIT go2rtc 1.9.15.
url: https://github.com/kapliy/go2rtc
image: ghcr.io/kapliy/go2rtc
arch: [ amd64, aarch64, i386, armv7 ]

# https://developers.home-assistant.io/docs/add-ons/configuration
version: 1.9.15-tapo1
slug: go2rtc-tapo-h265
init: false
startup: system
host_network: true
homeassistant_api: true
video: true
audio: true
ingress: true
ingress_port: 1984
panel_icon: mdi:camera-wireless
map: [ "config:rw", "media", "ssl" ]
